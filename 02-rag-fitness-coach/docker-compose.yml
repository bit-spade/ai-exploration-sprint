version: "3.9"

services:
  qdrant:
    image: qdrant/qdrant:v1.9.4
    container_name: rag_qdrant
    ports:
      - "6333:6333"   # REST API
      - "6334:6334"   # gRPC
    volumes:
      - qdrant_storage:/qdrant/storage
    restart: unless-stopped
    healthcheck:
      test: ["CMD-SHELL", "curl -sf http://localhost:6333/healthz || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 5

  ollama:
    image: ollama/ollama:latest
    container_name: rag_ollama
    ports:
      - "11434:11434"
    volumes:
      - ollama_models:/root/.ollama
    restart: unless-stopped
    # On Apple Silicon, Docker Desktop uses the Rosetta/virtualization layer.
    # If you want native MPS speed, run Ollama directly on the host instead:
    #   brew install ollama && ollama serve
    # and remove this service from compose (OLLAMA_BASE_URL stays the same).

volumes:
  qdrant_storage:
  ollama_models:
